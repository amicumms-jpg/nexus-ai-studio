<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Studio Pro - Ultimate Edition v9.7</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Script Supabase Client -->
    <script src="https://jsdelivr.net"></script>
    <!-- Stripe Script pentru Plăți -->
    <script src="https://stripe.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080910',
                        panelBg: '#121420',
                        neonViolet: '#8b5cf6',
                        accentIndigo: '#6366f1',
                        successGreen: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-panelBg border-b border-gray-800/80 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-20">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-accentIndigo to-neonViolet flex items-center justify-center text-white font-bold shadow-lg shadow-violet-500/20">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white tracking-wide">Nexus AI Studio Pro</h1>
                <span class="text-[10px] text-gray-400 flex items-center space-x-1.5">
                    <span id="apiStatusIndicator" class="w-2 h-2 rounded-full bg-red-500"></span>
                    <span id="apiStatusText">API Key Neconfigurat</span>
                </span>
            </div>
        </div>

        <!-- Buton Cont / Autentificare din Header -->
        <div id="auth-container" class="flex items-center space-x-2">
            <button onclick="switchTab('authAccount')" class="px-3 py-1.5 rounded-lg bg-accentIndigo text-white text-xs font-medium hover:opacity-90 transition flex items-center shadow cursor-pointer">
                <i class="fa-solid fa-user mr-1.5"></i> Cont / Autentificare
            </button>
        </div>

        <nav class="hidden xl:flex items-center space-x-1 text-[11px] font-medium overflow-x-auto">
            <button onclick="switchTab('chat')" class="px-2.5 py-2 rounded-lg bg-accentIndigo/20 text-accentIndigo flex items-center space-x-1.5 transition cursor-pointer"><i class="fa-solid fa-comments"></i><span>Chat AI</span></button>
            <button onclick="switchTab('geminiLive')" class="px-2.5 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center space-x-1.5 transition cursor-pointer"><i class="fa-solid fa-wave-square text-neonViolet animate-pulse"></i><span>Gemini Live</span></button>
            <button onclick="switchTab('aiVideoMaker')" class="px-2.5 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center space-x-1.5 transition cursor-pointer"><i class="fa-solid fa-video"></i><span>AI Video</span></button>
            <button onclick="switchTab('socialSuite')" class="px-2.5 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center space-x-1.5 transition cursor-pointer"><i class="fa-solid fa-share-nodes"></i><span>Social Media</span></button>
            <button onclick="switchTab('authAccount')" class="px-2.5 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center space-x-1.5 transition cursor-pointer"><i class="fa-solid fa-user-plus"></i><span>Cont</span></button>
            <button onclick="switchTab('billing')" class="px-2.5 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center space-x-1.5 transition cursor-pointer"><i class="fa-solid fa-credit-card"></i><span>Plată</span></button>
            <button onclick="switchTab('auth')" class="px-2.5 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center space-x-1.5 transition cursor-pointer"><i class="fa-solid fa-key"></i><span>API Key</span></button>
        </nav>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-panelBg/80 border-r border-gray-800/80 flex flex-col shrink-0 p-3 hidden sm:flex z-10">
            <button onclick="newSession()" class="w-full bg-gradient-to-r from-accentIndigo to-neonViolet hover:opacity-90 text-white text-xs font-semibold py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 shadow-md transition cursor-pointer">
                <i class="fa-solid fa-plus"></i>
                <span>Sesiune Nouă AI</span>
            </button>

            <div class="mt-5 flex-1 overflow-y-auto space-y-1">
                <span class="text-[10px] uppercase tracking-wider text-gray-500 font-bold px-2">Navigare Rapidă</span>
                <div class="mt-2 space-y-1 text-xs">
                    <button onclick="switchTab('chat')" class="w-full text-left p-2 rounded hover:bg-gray-800/60 text-gray-300 flex items-center space-x-2 cursor-pointer"><i class="fa-solid fa-comments text-accentIndigo"></i><span>Chat General</span></button>
                    <button onclick="switchTab('geminiLive')" class="w-full text-left p-2 rounded hover:bg-gray-800/60 text-gray-300 flex items-center space-x-2 cursor-pointer"><i class="fa-solid fa-wave-square text-neonViolet"></i><span>Gemini Live & Voice</span></button>
                    <button onclick="switchTab('aiVideoMaker')" class="w-full text-left p-2 rounded hover:bg-gray-800/60 text-gray-300 flex items-center space-x-2 cursor-pointer"><i class="fa-solid fa-video text-neonViolet"></i><span>AI Video Maker</span></button>
                    <button onclick="switchTab('socialSuite')" class="w-full text-left p-2 rounded hover:bg-gray-800/60 text-gray-300 flex items-center space-x-2 cursor-pointer"><i class="fa-solid fa-share-nodes text-purple-400"></i><span>Social Media Hub</span></button>
                    <button onclick="switchTab('authAccount')" class="w-full text-left p-2 rounded hover:bg-gray-800/60 text-gray-300 flex items-center space-x-2 cursor-pointer"><i class="fa-solid fa-user-shield text-accentIndigo"></i><span>Autentificare / Cont</span></button>
                    <button onclick="switchTab('billing')" class="w-full text-left p-2 rounded hover:bg-gray-800/60 text-gray-300 flex items-center space-x-2 cursor-pointer"><i class="fa-solid fa-credit-card text-successGreen"></i><span>Plată Card / Abonament</span></button>
                    <button onclick="switchTab('auth')" class="w-full text-left p-2 rounded hover:bg-gray-800/60 text-gray-300 flex items-center space-x-2 cursor-pointer"><i class="fa-solid fa-key text-yellow-500"></i><span>Setare API Key</span></button>
                </div>
            </div>

            <div class="mt-auto pt-3 border-t border-gray-800/80 text-xs">
                <div class="text-gray-400 text-[11px]">Model activ:</div>
                <div class="font-semibold text-successGreen mt-0.5 flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-successGreen animate-pulse"></span>
                    <span>Gemini 2.5 Flash</span>
                </div>
            </div>
        </aside>

        <!-- Dynamic Content Tabs -->
        <main class="flex-1 flex flex-col bg-darkBg overflow-hidden relative">
            
            <!-- Tab 1: Chat AI -->
            <div id="tab-chat" class="app-tab flex-1 flex flex-col h-full overflow-hidden">
                <div class="px-6 py-3 border-b border-gray-800/60 bg-panelBg/30 flex items-center justify-between shrink-0">
                    <div>
                        <h2 class="font-bold text-sm text-white">Nexus Neural Assistant</h2>
                        <p class="text-xs text-gray-400">Asistent inteligent pentru codare, marketing și creație digitală.</p>
                    </div>
                </div>

                <div id="chatMessages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-xl bg-accentIndigo/20 text-accentIndigo flex items-center justify-center shrink-0"><i class="fa-solid fa-robot"></i></div>
                        <div class="bg-panelBg border border-gray-800 p-3.5 rounded-2xl text-sm text-gray-200 max-w-[85%] shadow-sm">
                            Sesiune nouă inițializată. Cu ce te pot ajuta astăzi?
                        </div>
                    </div>
                </div>

                <div class="p-4 bg-panelBg/40 border-t border-gray-800 shrink-0">
                    <div class="max-w-4xl mx-auto flex items-center space-x-2 bg-gray-900 border border-gray-700/80 rounded-xl px-4 py-2.5 shadow-inner">
                        <input type="text" id="userInput" placeholder="Scrie un mesaj sau o cerere..." class="flex-1 bg-transparent text-sm text-gray-100 outline-none" onkeypress="if(event.key==='Enter') handleSendMessage()">
                        <button onclick="handleSendMessage()" class="bg-accentIndigo hover:opacity-90 text-white w-9 h-9 rounded-lg flex items-center justify-center transition shadow cursor-pointer"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Gemini Live & Voice Studio -->
            <div id="tab-geminiLive" class="app-tab" style="display: none; flex: 1; flex-direction: column; height: 100%; overflow-hidden; padding: 1.5rem; gap: 1rem;">
